gemini:
  api:
    key: # add gemini api key here
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent

openrouter:
  api:
    url: https://openrouter.ai/api/v1/chat/completions
    key: # add openrouter key here
    model: meta-llama/llama-3.3-70b-instruct:free

spring:
  # ---------------------------------------------------------
  # HER SPRING AI MANAGER AGENT (Added Section)
  # ---------------------------------------------------------
  ai:
    # 1. Fallback Provider (OpenRouter)
    openai:
      api-key: # add openrouter key here
      base-url: https://openrouter.ai # Must be base URL only for Spring AI
      chat:
        options:
          model: meta-llama/llama-3.3-70b-instruct:free

    # 2. Primary Provider (Google Gemini)
    google:
      genai:
        api-key: # add gemini key here
        chat:
          options:
            model: gemini-2.5-flash

  # ---------------------------------------------------------
  # EXISTING DATABASE CONFIGURATION
  # ---------------------------------------------------------
  datasource:
    url: jdbc:postgresql://localhost:5432/mydatabase
    username: myuser
    password: secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000 # 24 hours in milliseconds

