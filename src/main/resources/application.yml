openrouter:
  api:
    # MANUAL REST CLIENT: Needs the FULL path because you call it directly
    url: https://openrouter.ai/api/v1/chat/completions
    key: #openrouter key - ask Izaz
    model: meta-llama/llama-3.3-70b-instruct

spring:
  # ---------------------------------------------------------
  # HER SPRING AI MANAGER AGENT (Added Section)
  # ---------------------------------------------------------
  ai:
    # 1. Fallback Provider (OpenRouter)
    openai:
      api-key: #openrouter key - ask Izaz
      # SPRING AI: Needs to end in /api because Spring auto-appends /v1/chat/completions
      base-url: https://openrouter.ai/api
      chat:
        options:
          model: meta-llama/llama-3.3-70b-instruct

    # 2. Primary Provider (Google Gemini)
    google:
      genai:
        api-key: #gemini key
        chat:
          options:
            model: gemini-2.5-flash-lite

  # ---------------------------------------------------------
  # EXISTING DATABASE CONFIGURATION
  # ---------------------------------------------------------
  datasource:
    url: jdbc:postgresql://localhost:5432/mydatabase
    username: myuser
    password: secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000 # 24 hours in milliseconds

